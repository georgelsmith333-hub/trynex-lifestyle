name: Neon DB Daily Backup

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  schedule:
    # 01:00 UTC daily = 07:00 BST (Bangladesh Standard Time)
    - cron: '0 1 * * *'
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

# ── Required GitHub Secrets ───────────────────────────────────────────────────
#   DATABASE_URL   Your Neon PostgreSQL connection string
#
# ── How to add ────────────────────────────────────────────────────────────────
#   GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   Name: DATABASE_URL
#   Value: postgresql://user:pass@host/db?ssl=true
#
# ── Backup Storage ────────────────────────────────────────────────────────────
#   Backups are stored as GitHub Actions artifacts (free tier: 500MB, 30-day retention)
#   Each compressed Neon DB backup is typically 50KB–5MB
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  backup:
    name: "💾 Neon DB Backup"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client 2>&1 | tail -5

      - name: Create database dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ DATABASE_URL secret not set. Add it in GitHub repo Settings → Secrets."
            exit 1
          fi
          mkdir -p /tmp/db-backups
          FILENAME="/tmp/db-backups/trynex-backup-$(date +%Y-%m-%d-%H%M%S).sql.gz"
          echo "📦 Dumping database..."
          pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-acl \
            --clean \
            --if-exists \
            | gzip > "$FILENAME"
          SIZE=$(du -sh "$FILENAME" | cut -f1)
          echo "✅ Backup complete: $(basename $FILENAME) ($SIZE)"
          echo "BACKUP_FILE=$FILENAME" >> $GITHUB_ENV
          echo "BACKUP_SIZE=$SIZE" >> $GITHUB_ENV

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/db-backups/
          # 30-day retention on free GitHub plan (max 90 days on paid)
          retention-days: 30

      - name: Summary
        run: |
          echo "### 💾 DB Backup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Date | $(date '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | $BACKUP_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Retention | 30 days |" >> $GITHUB_STEP_SUMMARY
          echo "| Download | Actions → This run → Artifacts |" >> $GITHUB_STEP_SUMMARY
