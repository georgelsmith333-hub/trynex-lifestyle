name: Neon DB Daily Backup

on:
  schedule:
    # 01:00 UTC daily = 07:00 BST (Bangladesh Standard Time)
    - cron: '0 1 * * *'
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets:
#   DATABASE_URL_MAIN    Primary Neon connection string (ep-proud-hill)
#   DATABASE_URL_TRYNEX_DB  Secondary Neon (ep-small-cake)  [optional]
#
# Backups are stored as GitHub Actions artifacts (30-day retention).
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  backup:
    name: "💾 Neon DB Backup"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client 2>&1 | tail -5

      - name: Create primary database dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MAIN }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ DATABASE_URL_MAIN secret not set. Add it in GitHub repo Settings → Secrets."
            exit 1
          fi
          mkdir -p /tmp/db-backups
          FILENAME="/tmp/db-backups/trynex-primary-$(date +%Y-%m-%d-%H%M%S).sql.gz"
          echo "📦 Dumping primary database (Neon Main)..."
          pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-acl \
            --clean \
            --if-exists \
            | gzip > "$FILENAME"
          SIZE=$(du -sh "$FILENAME" | cut -f1)
          echo "✅ Primary backup: $(basename $FILENAME) ($SIZE)"
          echo "PRIMARY_BACKUP_SIZE=$SIZE" >> $GITHUB_ENV

      - name: Create secondary database dump (if configured)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TRYNEX_DB }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ℹ️  DATABASE_URL_TRYNEX_DB not set — skipping secondary backup."
            exit 0
          fi
          FILENAME="/tmp/db-backups/trynex-secondary-$(date +%Y-%m-%d-%H%M%S).sql.gz"
          echo "📦 Dumping secondary database (Neon Trynex DB)..."
          pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-acl \
            --clean \
            --if-exists \
            | gzip > "$FILENAME" || true
          SIZE=$(du -sh "$FILENAME" 2>/dev/null | cut -f1 || echo "0")
          echo "✅ Secondary backup: $(basename $FILENAME) ($SIZE)"
          echo "SECONDARY_BACKUP_SIZE=$SIZE" >> $GITHUB_ENV

      - name: Upload backups as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/db-backups/
          retention-days: 30

      - name: Summary
        run: |
          echo "### 💾 DB Backup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Date | $(date '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Primary Size | ${PRIMARY_BACKUP_SIZE:-unknown} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secondary Size | ${SECONDARY_BACKUP_SIZE:-skipped} |" >> $GITHUB_STEP_SUMMARY
          echo "| Retention | 30 days |" >> $GITHUB_STEP_SUMMARY
          echo "| Download | Actions → This run → Artifacts |" >> $GITHUB_STEP_SUMMARY
