name: CI

on:
  pull_request:
    branches: [main]
# CI runs on PRs only. Push to main is handled entirely by deploy.yml,
# which already includes typecheck as a required first step — running
# both on push would double the CI cost with identical checks.

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (libs + all workspaces)
        run: pnpm run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build storefront
        run: pnpm --filter @workspace/trynex-storefront run build
        env:
          NODE_ENV: production
          VITE_APP_ENV: production
