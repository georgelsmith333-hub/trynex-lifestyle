name: Deploy TryNex Lifestyle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Required GitHub Secrets (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN      Cloudflare token with Pages:Edit permission
#   CLOUDFLARE_ACCOUNT_ID     Cloudflare account ID
# Optional but recommended:
#   RENDER_DEPLOY_HOOK_URL    Render → Service → Settings → Deploy Hook

jobs:
  typecheck:
    name: "🔍 Strict TypeScript Check"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm run typecheck

  build-api:
    name: "🏗️ API Build Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [typecheck]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

  deploy-frontend:
    name: "☁️ Frontend → Cloudflare Pages"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [typecheck]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storefront production bundle
        run: NODE_ENV=production pnpm --filter @workspace/trynex-storefront run build
        env:
          VITE_API_BASE_URL: "https://trynex-api.onrender.com"

      - name: Require Cloudflare deployment secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "❌ Cloudflare deploy skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing."
            echo "Add both in GitHub → repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "✅ Cloudflare secrets present. Deploy will run."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: trynex-lifestyle-shop
          directory: artifacts/trynex-storefront/dist
          wranglerVersion: "3"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-backend:
    name: "🚀 Backend → Render.com"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [build-api]

    steps:
      - name: Trigger Render deploy hook when configured
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "ℹ️ RENDER_DEPLOY_HOOK_URL is not set."
            echo "If Render auto-deploy from GitHub is enabled, this is okay. If not, backend code will not deploy."
            exit 0
          fi

          echo "Firing Render deploy hook…"
          HTTP=$(curl -s -o /tmp/render.json -w "%{http_code}" \
            -X POST "$RENDER_HOOK" \
            -H "Accept: application/json")
          echo "Render API response: HTTP $HTTP"
          cat /tmp/render.json 2>/dev/null || true
          if [ "$HTTP" -ge 400 ]; then
            echo "❌ Render deploy hook failed — HTTP $HTTP"
            exit 1
          fi
          echo "✅ Render deploy triggered (HTTP $HTTP)"

  smoke-test:
    name: "🔥 Post-deploy Smoke Test"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [deploy-frontend, deploy-backend]

    steps:
      - name: Verify live frontend and API
        run: |
          check_url() {
            local label="$1"
            local url="$2"
            local expected="$3"
            local http="000"
            for i in $(seq 1 12); do
              http=$(curl -L -s -o /tmp/smoke.json -w "%{http_code}" "$url" || true)
              echo "$label attempt $i: HTTP $http"
              if [ "$http" = "$expected" ]; then
                echo "✅ $label OK"
                return 0
              fi
              sleep 10
            done
            echo "❌ $label failed after retries. Last HTTP: $http"
            cat /tmp/smoke.json 2>/dev/null || true
            return 1
          }

          check_url "Render API health" "https://trynex-api.onrender.com/api/healthz" "200"
          check_url "Products endpoint" "https://trynex-api.onrender.com/api/products?limit=1" "200"
          check_url "Frontend" "https://trynexshop.com" "200"
