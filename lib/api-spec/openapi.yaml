openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TryNex Lifestyle API — Bangladesh custom merchandise e-commerce platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product catalogue
  - name: categories
    description: Product categories
  - name: orders
    description: Order lifecycle
  - name: auth
    description: Customer authentication
  - name: blog
    description: Blog posts
  - name: hampers
    description: Gift hamper packages
  - name: promo-codes
    description: Promotional codes and referrals
  - name: reviews
    description: Product reviews
  - name: settings
    description: Site-wide settings
  - name: newsletter
    description: Newsletter subscriptions
  - name: admin
    description: Admin-only operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 12 }
        - in: query
          name: categoryId
          schema: { type: integer }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: featured
          schema: { type: boolean }
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
                required: [products, total, page, limit, totalPages]
    post:
      operationId: createProduct
      tags: [products]
      summary: Create product (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID or slug
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update product (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete product (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
                required: [categories]

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Paginated order list
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
                required: [orders, total, page, limit, totalPages]
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/track:
    post:
      operationId: trackOrder
      tags: [orders]
      summary: Track order by number and identity
      description: >
        Returns order status for the given order number.
        Requires either email or phone to verify the caller's identity
        and prevent order enumeration attacks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderNumber: { type: string, example: "TN2505001ABCD" }
                email: { type: string, format: email }
                phone: { type: string }
              required: [orderNumber]
      responses:
        "200":
          description: Order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/customer/me:
    get:
      operationId: getMyOrders
      tags: [orders]
      summary: List orders for the current customer
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Customer order list
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                required: [orders]

  /auth/register:
    post:
      operationId: registerCustomer
      tags: [auth]
      summary: Register a new customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
                phone: { type: string }
              required: [name, email, password]
      responses:
        "201":
          description: Customer created with JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: loginCustomer
      tags: [auth]
      summary: Customer email and password login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
              required: [email, password]
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logoutCustomer
      tags: [auth]
      summary: Customer logout (clears cookie)
      responses:
        "200":
          description: Logged out

  /auth/google:
    post:
      operationId: googleAuth
      tags: [auth]
      summary: Google One-Tap or OAuth sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credential: { type: string, description: "Google ID token" }
              required: [credential]
      responses:
        "200":
          description: Authenticated via Google
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/facebook:
    post:
      operationId: facebookAuth
      tags: [auth]
      summary: Facebook OAuth sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accessToken: { type: string }
                userId: { type: string }
              required: [accessToken]
      responses:
        "200":
          description: Authenticated via Facebook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getCustomerMe
      tags: [auth]
      summary: Get current authenticated customer profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: "#/components/schemas/Customer"
                required: [customer]
    put:
      operationId: updateCustomerMe
      tags: [auth]
      summary: Update current customer profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: "#/components/schemas/Customer"
                required: [customer]

  /auth/guest:
    post:
      operationId: guestCheckout
      tags: [auth]
      summary: Create or retrieve a guest session for checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
              required: [name, email]
      responses:
        "200":
          description: Guest customer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /blog:
    get:
      operationId: listBlogPosts
      tags: [blog]
      summary: List published blog posts
      parameters:
        - in: query
          name: published
          schema: { type: boolean }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Blog post list
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/BlogPost"
                required: [posts]

  /blog/{slug}:
    get:
      operationId: getBlogPost
      tags: [blog]
      summary: Get blog post by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Blog post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /blog/categories:
    get:
      operationId: listBlogCategories
      tags: [blog]
      summary: List blog categories
      responses:
        "200":
          description: Blog categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items: { type: string }
                required: [categories]

  /blog/settings:
    get:
      operationId: getBlogSettings
      tags: [blog]
      summary: Get blog configuration settings
      responses:
        "200":
          description: Blog settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  postsPerPage: { type: integer }
                required: [enabled]

  /hampers:
    get:
      operationId: listHampers
      tags: [hampers]
      summary: List gift hamper packages
      responses:
        "200":
          description: Hamper list
          content:
            application/json:
              schema:
                type: object
                properties:
                  hampers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Hamper"
                required: [hampers]

  /hampers/{slug}:
    get:
      operationId: getHamper
      tags: [hampers]
      summary: Get hamper by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Hamper detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hamper"

  /admin/hampers:
    get:
      operationId: adminListHampers
      tags: [admin, hampers]
      summary: List all hampers (admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: All hampers
          content:
            application/json:
              schema:
                type: object
                properties:
                  hampers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Hamper"
                required: [hampers]
    post:
      operationId: adminCreateHamper
      tags: [admin, hampers]
      summary: Create a new hamper package
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug: { type: string }
                name: { type: string }
                nameBn: { type: string }
                description: { type: string }
                descriptionBn: { type: string }
                category: { type: string }
                occasion: { type: string }
                imageUrl: { type: string }
                images: { type: array, items: { type: string } }
                basePrice: { type: number }
                discountPrice: { type: number }
                items: { type: array, items: { type: object } }
                isCustomizable: { type: boolean }
                active: { type: boolean }
                featured: { type: boolean }
                sortOrder: { type: integer }
                stock: { type: integer }
                tags: { type: array, items: { type: string } }
              required: [slug, name, basePrice]
      responses:
        "201":
          description: Created hamper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hamper"
        "409":
          description: Slug already exists

  /admin/hampers/{id}:
    put:
      operationId: adminUpdateHamper
      tags: [admin, hampers]
      summary: Update a hamper package
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Hamper"
      responses:
        "200":
          description: Updated hamper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hamper"
        "404":
          description: Not found
    delete:
      operationId: adminDeleteHamper
      tags: [admin, hampers]
      summary: Delete a hamper package
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]

  /promo-codes/validate:
    post:
      operationId: validatePromoCode
      tags: [promo-codes]
      summary: Validate a promo or referral code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                orderTotal: { type: number }
                customerEmail: { type: string, format: email }
              required: [code, orderTotal]
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  discount: { type: number }
                  code: { type: string }
                  message: { type: string }
                  isReferral: { type: boolean }
                required: [valid]

  /reviews/{productId}:
    get:
      operationId: listProductReviews
      tags: [reviews]
      summary: List approved reviews for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reviews and aggregate stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews: { type: array, items: { type: object } }
                  stats:
                    type: object
                    properties:
                      total: { type: integer }
                      average: { type: number }
                      distribution: { type: object }
                    required: [total, average, distribution]
                required: [reviews, stats]

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get public site settings
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update site settings (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  /newsletter/subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe an email to the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                source: { type: string, default: "footer" }
              required: [email]
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                required: [ok]

  /newsletter/subscribers:
    get:
      operationId: listNewsletterSubscribers
      tags: [newsletter]
      summary: List newsletter subscribers (admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Subscriber list
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribers: { type: array, items: { type: object } }
                  total: { type: integer }
                required: [subscribers, total]

  /newsletter/subscribers/{id}:
    delete:
      operationId: deleteNewsletterSubscriber
      tags: [newsletter]
      summary: Delete a newsletter subscriber (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Subscriber deleted

  /public-stats:
    get:
      operationId: getPublicStats
      tags: [orders]
      summary: Anonymous public order count statistics
      responses:
        "200":
          description: Public stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  todayOrders: { type: integer }
                  totalOrders: { type: integer }
                  minutesSinceLastOrder: { type: integer, nullable: true }
                required: [todayOrders, totalOrders]

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin password login (step 1 of 2FA flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
              required: [username, password]
      responses:
        "200":
          description: Authenticated or 2FA required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  token: { type: string }
                  requiresTotp: { type: boolean }
                  partialToken: { type: string }

  /admin/login-totp:
    post:
      operationId: adminLoginTotp
      tags: [admin]
      summary: Admin TOTP 2FA verification (step 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partialToken: { type: string }
                totpCode: { type: string }
              required: [partialToken, totpCode]
      responses:
        "200":
          description: Authenticated with 2FA
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  token: { type: string }

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout (revokes session)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Logged out

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Get current admin profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin:
                    type: object
                    properties:
                      id: { type: integer }
                      username: { type: string }
                      authenticated: { type: boolean }
                      totpEnabled: { type: boolean }
                    required: [id, username, authenticated, totpEnabled]
                required: [admin]

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Admin dashboard statistics
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Dashboard stats with revenue, orders, products
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalOrders: { type: integer }
                  pendingOrders: { type: integer }
                  processingOrders: { type: integer }
                  shippedOrders: { type: integer }
                  deliveredOrders: { type: integer }
                  totalRevenue: { type: number }
                  todayRevenue: { type: number }
                  totalProducts: { type: integer }
                  lowStockProducts: { type: integer }
                  recentOrders: { type: array, items: { type: object } }
                required: [totalOrders, totalRevenue, totalProducts]

  /admin/change-password:
    put:
      operationId: adminChangePassword
      tags: [admin]
      summary: Change admin password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
                totpCode: { type: string }
              required: [currentPassword, newPassword]
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                required: [success]

  /admin/totp-setup:
    get:
      operationId: adminTotpSetup
      tags: [admin]
      summary: Generate TOTP secret and QR code for 2FA setup
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: TOTP setup info with QR data URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  qrDataUrl: { type: string }
                required: [secret, qrDataUrl]

  /admin/totp-enable:
    post:
      operationId: adminTotpEnable
      tags: [admin]
      summary: Confirm and enable 2FA with a valid TOTP code
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                totpCode: { type: string, minLength: 6 }
              required: [totpCode]
      responses:
        "200":
          description: 2FA enabled

  /admin/totp-disable:
    post:
      operationId: adminTotpDisable
      tags: [admin]
      summary: Disable 2FA with a valid TOTP code
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                totpCode: { type: string, minLength: 6 }
              required: [totpCode]
      responses:
        "200":
          description: 2FA disabled

  /admin/sessions:
    get:
      operationId: listAdminSessions
      tags: [admin]
      summary: List active admin sessions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        createdAt: { type: string, format: date-time }
                        lastUsedAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }
                        userAgent: { type: string, nullable: true }
                        ip: { type: string, nullable: true }
                      required: [id]
                required: [sessions]

  /admin/sessions/{id}:
    delete:
      operationId: revokeAdminSession
      tags: [admin]
      summary: Revoke a single admin session by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                required: [success]
        "400":
          description: Invalid session id
        "500":
          description: Server error

  /admin/sessions/revoke-all:
    post:
      operationId: revokeAllAdminSessions
      tags: [admin]
      summary: Revoke all active admin sessions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: All sessions revoked

  /admin/reset-password:
    post:
      operationId: adminResetPassword
      tags: [admin]
      summary: Reset admin password using a pre-shared reset key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resetKey: { type: string }
                newPassword: { type: string, minLength: 8 }
              required: [resetKey, newPassword]
      responses:
        "200":
          description: Password reset

