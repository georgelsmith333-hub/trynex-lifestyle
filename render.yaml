services:
  - type: web
    name: trynex-api-server
    env: node
    region: oregon
    plan: starter
    buildCommand: pnpm install && pnpm build
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8082"
      - key: DATABASE_URL
        fromDatabase:
          name: trynex-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    # The API mounts health routes under /api; use the meaningful dependency check.
    healthCheckPath: /api/health/readiness
    healthCheckInterval: 10
    maxInstances: 3
    minInstances: 1
    autoDeploy: true

databases:
  - name: trynex-db
    databaseName: trynex_prod
    user: trynex_user
    region: oregon
    plan: starter
    postgresMajorVersion: "16"
